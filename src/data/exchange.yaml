reports:
  - date: 2026-04-01
    title: { zh: 参与巴中低空智能管理示范项目研讨，就 AI 大模型落地与空管系统融合提出建议, en: "Advises on a low-altitude intelligent management demonstration project in Bazhong" }
    desc:
      zh: 在“低空智能起降平台及协同空域管理关键技术研究及应用”项目研讨中，王正宁教授与民航二所专家一起，就 AI 大模型技术落地、通用系统打造以及与民航空管系统融合等方面提出指导意见。
      en: At a review of the project on intelligent low-altitude take-off and landing platforms and collaborative airspace management, Prof. Wang and CAAC Second Research Institute experts advised on deploying large AI models, building general-purpose systems and integrating them with civil air traffic management.
    source: { zh: 纵横股份 公众号（成都市无人机产业协会等转载）, en: "JOUAV WeChat account (reposted by the Chengdu UAV Industry Association and others)" }
