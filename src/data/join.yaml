# ==============================================================
#  加入我们（招生信息）
#  以下为根据研究方向拟写的草稿，请按学院当年招生政策修改。
#  - intro 同时显示在首页底部的招生卡片中
#  - positions 的 icon 可选：sparkles / graduation / book / users / flask / brain
#  - message：「我们希望你」一栏的寄语（空行分段）；如需在寄语下方列出要点，可再加 requirements 列表（zh / en）
# ==============================================================

intro:
  zh: 课题组长期招收对人工智能充满热情、希望在强化学习、工业视觉、医学影像或具身智能等方向深入研究的博士、硕士研究生和本科生。你将参与前沿课题，有机会在顶级期刊和会议发表成果，并与国内外高校、医院和企业开展合作。
  en: We welcome Ph.D., Master's and undergraduate students who are passionate about AI and eager to work on reinforcement learning, industrial vision, medical imaging or embodied intelligence. You will work on frontier problems, publish at top venues, and collaborate with universities, hospitals and companies at home and abroad.

positions:
  - icon: graduation
    title: { zh: 博士研究生, en: Ph.D. Students }
    desc:
      zh: 面向信息与通信工程、电子信息等专业招收博士研究生，欢迎在强化学习、计算机视觉、医学影像或具身智能方向有研究基础的同学联系。
      en: Ph.D. positions in Information & Communication Engineering and Electronic Information. Prior research in reinforcement learning, vision, medical imaging or embodied AI is a plus.
  - icon: sparkles
    title: { zh: 硕士研究生, en: Master's Students }
    desc:
      zh: 每年招收学术型与专业型硕士研究生，欢迎推免生和统考生提前联系，了解课题方向与组内培养方式。
      en: Academic and professional Master's positions every year. Recommended and exam-admitted applicants are welcome to reach out early.
  - icon: book
    title: { zh: 本科生科研, en: Undergraduate Research }
    desc:
      zh: 欢迎本科生进组参与科研训练、大创项目、毕业设计和学科竞赛，表现优秀者可优先推荐读研。
      en: Undergraduates can join for research training, innovation projects, theses and competitions; strong performers get priority for graduate admission.

# 「我们希望你」一栏的寄语（2026-10-29 课题组定稿），空行分段
message:
  zh: |
    如果你最终加入视觉计算与智能决策实验室（VCID Lab），我们之间便不只是师生，你也会成为这个团队真正的一员。这是一支年轻、对科研充满热情的队伍，在强化学习、工业视觉、医学影像和具身智能等方向都有扎实积累；系统的科研训练与真实的项目历练，会让你的学术能力在这里加速成长。

    不过，成长能有多快，终究取决于你自己。比起天赋，我们更看重你做研究的动机、态度与投入。愿你始终保有好奇心，既敢于大胆假设，也习惯于小心求证；愿你尊重权威而不迷信权威，在独立思考中找到自己的方向，并有耐心把一个想法打磨到极致。

    论文只是思考落脚的地方。它真正的价值不在数量，而在于你是否为这个领域添了一块砖，让后来者能站得更高、走得更远。

    我们期待与你并肩，让好奇心一步步长成成果。
  en: |
    If you join the Visual Computing and Intelligent Decision Lab (VCID Lab), we will be more than teacher and student — you will become a true member of this team. We are a young group with a real passion for research and solid experience in reinforcement learning, industrial vision, medical imaging and embodied intelligence. Systematic research training and hands-on work on real projects will help your academic abilities grow quickly here.

    How fast you grow, though, is ultimately up to you. More than talent, we value your motivation, attitude and commitment to research. May you always stay curious — bold in forming hypotheses and careful in testing them. May you respect authority without blindly following it, find your own direction through independent thinking, and have the patience to refine an idea until it is truly polished.

    A paper is simply where your thinking comes to rest. Its real value lies not in numbers, but in whether you have laid a brick for the field, helping those who come after you stand higher and go further.

    We look forward to working side by side with you, turning curiosity, step by step, into results.

apply:
  zh:
    - 准备个人简历，附成绩单、获奖情况和科研/项目经历
    - 发送至课题组邮箱，邮件标题注明「申请类型 + 姓名 + 学校」
    - 我们会尽快回复合适的申请者，并安排线上或线下交流
  en:
    - Prepare a CV with transcripts, awards and research or project experience
    - "Email it to the group with the subject line: position + name + university"
    - We will reply to suitable applicants and arrange a conversation
