# ==============================================================
#  团队生活（相册）
#  - 每个相册一张卡片，按这里的顺序显示；第一个相册显示为大图；首页「团队生活」展示前 5 个相册
#  - id：相册的英文短名，用于链接，例如新闻中的 page: life#2026-graduation
#  - photos：照片 / 视频放在 public/images/life/相册文件夹/ 下，按顺序填写；点击卡片可全屏浏览整组
#           支持 .jpg / .png 照片和 .mp4 视频；caption 可选，不填时显示相册名称
#           照片建议长边 1600 像素左右、单张不超过 500 KB（太大的照片会拖慢网页）
#  - cover：卡片封面（可选，建议用缩小版图片）；不填时用第一张照片
#  - photos 留空时显示「照片待补充」的占位卡片，icon 为占位图标（chat / mic / graduation / mountain / star / users / camera）
#  - date：可以写 2026-06-22、2026-06 或 2026；留空不显示
# ==============================================================

