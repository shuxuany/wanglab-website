  # 简介：2026-10-20 根据课题组提供的个人简历（2025-09 版）、研究成果详表和成都市航空航天产业联盟专家介绍整理
  bio:
    zh: |
      王正宁，博士，教授、博士生导师，天府绛溪实验室电磁空间前沿研究中心副主任，成都市航空航天产业联盟副秘书长。2007 年于西南交通大学获计算机应用技术博士学位（硕博连读），2009–2011 年在中国民用航空总局第二研究所从事博士后研究，2014–2015 年由国家留学基金委公派赴美国南加州大学访问，与信号与图像处理领域著名学者 C.-C. Jay Kuo 教授开展合作研究；2013–2014 年曾挂职南京经济技术开发区科技人才局副局长。长期从事人工智能、机器学习、具身智能、图像处理与多媒体通信等领域的科研与教学。

      在 IEEE TITS、IEEE TCSVT、Pattern Recognition、Medical Image Analysis、Cerebral Cortex 等期刊和 CVPR、ICCV、AAAI、ACM MM 等会议发表学术论文 80 余篇，获授权国家发明专利 40 余项（其中第一发明人 30 项），登记软件著作权 3 项。作为项目负责人主持国家自然科学基金面上项目 2 项、省部级科技研发计划项目 5 项，以及中国博士后科学基金项目等；作为主要研究人员参与国家科技支撑计划项目课题“机场 III 级综合交通监视与引导系统”、国家自然科学基金民航联合基金重点项目“机场跑道异物监测系统基础理论与关键技术研究”、国家自然科学基金国际（地区）合作与交流项目“电子内镜和无线胶囊内镜图像处理关键技术研究”，以及四川省重大科技专项、重点研发计划等省部级项目十余项。

      注重科研成果的转化应用。作为主要完成人之一研制的机场全景增强监视系统是国内首套机场场面全景增强监视系统，融合视频、雷达与 ADS-B 数据，已部署于成都双流、重庆江北、昆明长水、广州白云等多个机场，并列入民航局机场新技术名录；跑道异物检测相关技术应用于北京大兴、成都天府、兰州中川等机场；参与的国产化机载娱乐系统应用于 C919 大型客机；工业视觉检测算法已应用于半导体、汽车等制造领域。获民航科学技术奖二等奖、中国交通运输协会科技进步奖三等奖、2025 年航空灵巧手菁英赛“智臻至善奖”等，入选四川省海外高层次留学人才。

      担任 APSIPA Transactions on Signal and Information Processing 编委、Frontiers in Neuroscience 客座编辑，中国计算机学会多媒体技术专业委员会委员、中国自动化学会分数阶系统与控制专业委员会委员，IEEE TIP、TMM、TCSVT 及 CVPR、ICCV、ACM MM 等期刊和会议审稿人，ISPACS 2010、VCIP 2016 国际会议 Local Chair，ICME 2014 组委会成员，2020 年中国多媒体大会荣誉讲者。同时担任四川省科技厅航空与燃机重大科技专项专家委员会专家、“十三五”“十四五”高新技术领域指南编制专家，天府绛溪实验室博士后学术导师，并长期为多家高新技术企业提供技术指导。
    en: |
      Zhengning Wang, Ph.D., is a Professor and doctoral supervisor, Deputy Director of the Electromagnetic Space Frontier Research Center at Tianfu Jiangxi Laboratory, and Deputy Secretary-General of the Chengdu Aerospace Industry Alliance. He received his Ph.D. in Computer Application Technology from Southwest Jiaotong University in 2007 (combined master's–doctoral program), was a postdoctoral fellow at the Second Research Institute of the Civil Aviation Administration of China from 2009 to 2011, and from 2014 to 2015 was a visiting scholar at the University of Southern California, sponsored by the China Scholarship Council, working with Prof. C.-C. Jay Kuo, a renowned scholar in signal and image processing. From 2013 to 2014 he served on secondment as Deputy Director of the Science, Technology and Talent Bureau of the Nanjing Economic and Technological Development Zone. His research and teaching cover artificial intelligence, machine learning, embodied intelligence, image processing and multimedia communication.

      He has published more than 80 papers in journals such as IEEE TITS, IEEE TCSVT, Pattern Recognition, Medical Image Analysis and Cerebral Cortex and at conferences including CVPR, ICCV, AAAI and ACM MM. He holds more than 40 granted Chinese invention patents (30 as first inventor) and 3 registered software copyrights. As principal investigator he has led two NSFC General Program projects, five provincial R&D projects and a China Postdoctoral Science Foundation project. As a key researcher he has taken part in the subproject "Level-III Airport Integrated Traffic Surveillance and Guidance System" of the National Key Technology R&D Program, the NSFC–CAAC Joint Fund key project on airport runway foreign object debris detection, the NSFC International Cooperation project on image processing for electronic and wireless capsule endoscopy, and more than ten Sichuan major science and technology and key R&D projects.

      He puts strong emphasis on applying research results. The airport panoramic enhanced surveillance system, which he helped develop as one of its main contributors, was China's first panoramic surveillance system for airport surfaces. It fuses video, radar and ADS-B data, has been deployed at airports including Chengdu Shuangliu, Chongqing Jiangbei, Kunming Changshui and Guangzhou Baiyun, and is listed in the CAAC catalogue of new airport technologies. Related runway foreign object detection technology is used at Beijing Daxing, Chengdu Tianfu and Lanzhou Zhongchuan airports; a domestically developed in-flight entertainment system he contributed to is used on the C919 airliner; and his industrial visual inspection algorithms are applied in semiconductor and automotive manufacturing. His awards include a Second Prize of the Civil Aviation Science and Technology Award, a Third Prize of the China Communications and Transportation Association Science and Technology Progress Award and the "Excellence" award of the 2025 Aviation Dexterous Hand Elite Challenge, and he was recognized as a Sichuan High-Level Overseas-Returned Talent.

      He is an editorial board member of APSIPA Transactions on Signal and Information Processing, a guest editor of Frontiers in Neuroscience, a member of the CCF Technical Committee on Multimedia Technology and of the CAA Technical Committee on Fractional-Order Systems and Control, and a reviewer for IEEE TIP, TMM, TCSVT, CVPR, ICCV and ACM MM. He was Local Chair of ISPACS 2010 and VCIP 2016, a member of the ICME 2014 organizing committee, and an Honored Speaker at the 2020 China Multimedia Conference. He also serves as an expert on the Sichuan Provincial Department of Science and Technology committee for the aviation and gas turbine major project, helped draft the province's high-tech R&D guidelines for the 13th and 14th Five-Year Plans, supervises postdoctoral researchers at Tianfu Jiangxi Laboratory, and advises several high-tech companies.
