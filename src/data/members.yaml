  bio:
    zh: |
      王正宁，男，博士，教授。毕业于西南交通大学，现任职于电子科技大学从事图像处理、计算机视觉、人工智能等领域的科研工作。于2014-2015在国家留基委公派赴美国南加州大学访问，与信号与图像处理领域全球著名教授C.C. Jay Kuo开展研究合作。近些年在国内外高级期刊和会议上累计发表学术论文60余篇，国家发明专利30余项。

      作为项目负责人先后承担了国家自然科学基金面上项目2项，中国博士后科学基金1项，四川省重点研发计划项目4项，四川省重大科技专项1项。作为主要科研人员参加了国家科技支撑计划重大项目“中国民航协同空管技术综合应用示范”课题——“机场III级综合交通监视与引导系统”、国家自然科学基金民航联合基金重点项目“机场跑道异物监测系统基础理论与关键技术研究”、国家自然科学基金国际合作重点项目“电子内镜和无线胶囊内镜图像处理关键技术研究”，国家自然科学基金青年基金项目“针对视觉映射的鲁棒混合回归模型研究”、中国民航总局民航科技专项基金项目“基于增强现实的机场场面监视系统关键技术研究”，以及一些企业产学研合作项目。同时，还是Frontiers in NeuroScience、IEEE TIP、IEEE TMM、中国图形图象学报等期刊的审稿专家，ICASSIP和ISPACS等国际会议的审稿专家，ISPACS2010、VCIP2016国际会议Local Chair，ICME2014国际学术会议组委会成员，ISCAS 2015 国际会议论文评审专家，ICASSIP 2014、VCIP2016国际会议论文评审专家。
    en: |
      Zhengning Wang, Ph.D., is a Professor at the University of Electronic Science and Technology of China (UESTC), working on image processing, computer vision and artificial intelligence. He graduated from Southwest Jiaotong University. From 2014 to 2015 he was a visiting scholar at the University of Southern California, sponsored by the China Scholarship Council, where he collaborated with Prof. C.-C. Jay Kuo, a world-renowned scholar in signal and image processing. In recent years he has published more than 60 papers in leading journals and conferences and holds more than 30 Chinese invention patents.

      As principal investigator, he has led two NSFC General Program projects, one China Postdoctoral Science Foundation project, four Sichuan Key R&D Program projects and one Sichuan Major Science and Technology project. As a key researcher, he has taken part in the subproject "Level-III Airport Integrated Traffic Surveillance and Guidance System" of the National Key Technology R&D Program project "Comprehensive Application Demonstration of China Civil Aviation Collaborative Air Traffic Management Technology"; the NSFC–CAAC Joint Fund key project "Fundamental Theory and Key Technologies of Airport Runway Foreign Object Debris Detection Systems"; the NSFC International Cooperation key project "Key Technologies of Image Processing for Electronic Endoscopy and Wireless Capsule Endoscopy"; the NSFC Young Scientists Fund project "Robust Mixture Regression Models for Visual Mapping"; the CAAC Civil Aviation Science and Technology project "Key Technologies of Augmented-Reality-Based Airport Surface Surveillance Systems"; and several industry–academia collaborations. He reviews for Frontiers in Neuroscience, IEEE TIP, IEEE TMM and the Journal of Image and Graphics, and for international conferences including ICASSIP and ISPACS. He was Local Chair of ISPACS 2010 and VCIP 2016, a member of the ICME 2014 organizing committee, and a paper reviewer for ISCAS 2015, ICASSIP 2014 and VCIP 2016.
