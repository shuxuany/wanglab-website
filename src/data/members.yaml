  # ---------------- 以下用于导师详细介绍页（/people/wangzhengning/）
  # 研究内容：每项一个加粗标题 + 一段详细说明（参考中科院计算所 VIPL 组主页的写法）
  research_intro:
    zh: 围绕“让机器看得清、看得懂，并在真实世界中行动”，从视觉感知、理解到智能决策开展研究，并推动成果在民航、工业和医疗等领域落地。主要研究内容包括：
    en: "Guided by the goal of machines that see clearly, understand deeply and act in the real world, the group works from visual perception and understanding to intelligent decision-making, and brings its results into civil aviation, industry and healthcare. Main research topics:"
  research_content:
    - title: { zh: 强化学习与智能决策, en: Reinforcement learning and intelligent decision-making }
      desc:
        zh: 研究多智能体强化学习中的信用分配、训练稳定性与可解释性，提出基于锚定超图的信用分配方法 HySTAR；基于时空图卷积和双重注意力开展飞行器 4D 航迹预测（MTDA-STGCN）；探索与世界模型结合的强化学习，让智能体在“想象”中预演和规划，服务于无人系统协同与低空交通管理等复杂决策场景。
        en: Credit assignment, training stability and explainability in multi-agent reinforcement learning, including HySTAR, an anchored-hypergraph credit assignment method; 4D aircraft trajectory prediction with spatiotemporal graph convolution and dual attention (MTDA-STGCN); and reinforcement learning with world models that rehearse and plan in imagination, for cooperative unmanned systems and low-altitude traffic management.
    - title: { zh: 工业视觉检测, en: Industrial visual inspection }
      desc:
        zh: 面向半导体、汽车等制造业的质量检测需求，研究缺陷样本稀缺条件下的无监督缺陷检测与定位（自监督重构、自适应对齐与差异增强），以及旋转鲁棒的特征点检测与描述、异源图像配准和图像拼接等高精度视觉测量技术，相关算法已在企业产线落地应用。
        en: Quality inspection for semiconductor, automotive and other manufacturing — unsupervised defect detection and localization when defect samples are scarce (self-supervised reconstruction, adaptive alignment and difference enhancement), rotation-robust keypoint detection and description, multi-source image registration and image stitching. The algorithms are deployed on production lines.
    - title: { zh: 工业 AI 软件与软硬件协同, en: Industrial AI software and hardware–software co-design }
      desc:
        zh: 研究模型压缩、量化与推理加速，面向边缘设备和嵌入式平台的部署，以及数据采集、标注、训练和版本管理的一体化工具链；与芯片设计团队合作研究高并行目标检测后处理引擎和超低功耗环境声音识别处理器，推动 AI 算法从实验室走向工业现场。
        en: Model compression, quantization and inference acceleration, deployment on edge and embedded platforms, and integrated toolchains for data collection, labelling, training and versioning; with chip designers, a high-parallel detection post-processing engine and an ultra-low-energy sound recognition processor — taking AI from the lab to the factory floor.
    - title: { zh: 医学影像处理, en: Medical image processing }
      desc:
        zh: 基于结构 MRI、静息态功能 MRI 和弥散成像构建个体化脑网络，用图神经网络、注意力机制与交叉注意力融合多模态特征，开展精神分裂症、孤独症、抑郁症和阿尔茨海默病的辅助诊断、脑龄预测与纹状体精细分区，并将模型学到的脑区权重与基因表达、细胞类型转录组特征关联，寻找可解释的影像标志物。
        en: Individual brain networks built from structural MRI, resting-state fMRI and diffusion imaging, with graph neural networks, attention and cross-attention fusing multimodal features for diagnosing schizophrenia, autism, depression and Alzheimer's disease, predicting brain age and parcellating the striatum; learned regional weights are related to gene expression and cell-type transcriptomic features to find interpretable imaging biomarkers.
    - title: { zh: 图像增强与恢复, en: Image enhancement and restoration }
      desc:
        zh: 面向低照度、雾霾、压缩失真、反光和屏下成像等退化场景，研究分数阶 Retinex 变分框架、极低照度感知细节生成对抗网络、压缩视频重建流增强、暗光压缩图像增强与屏下摄像头复原，以及可信的无参考图像质量评价；早期研究成果包括机场雾天实时增强监视系统。
        en: Restoration of images degraded by low light, haze, compression, reflections and under-display optics — a fractional-order variational Retinex framework, a perceptual-details GAN for extremely low light, reconstruction-flow enhancement of compressed video, enhancement of compressed dark images and under-display camera restoration — plus trustworthy blind image quality assessment. Earlier work includes a real-time enhanced surveillance system for airports in fog.
    - title: { zh: 具身智能与空地协同感知, en: Embodied intelligence and air–ground perception }
      desc:
        zh: 研究点云三维目标检测（SVGA-Net）、双目与激光雷达融合检测、事件相机光流与网格流估计、带宽受限条件下的空中边缘感知与可通行性建图，以及基于自监督视觉表征的世界模型，打通从感知、预测到控制的链路，服务于无人系统与低空智能。
        en: 3D object detection from point clouds (SVGA-Net), stereo–LiDAR fusion, optical flow and meshflow estimation from event cameras, bandwidth-constrained aerial edge perception and traversability mapping, and world models built on self-supervised visual representations — linking perception, prediction and control for unmanned systems and low-altitude intelligence.
