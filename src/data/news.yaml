# ==============================================================
#  新闻动态
#  - date 格式：YYYY-MM-DD，也可以只写到月份 YYYY-MM（网页自动按时间倒序排列，首页显示最新 6 条）
#  - body、link 可选；link 可以是公众号文章等外部链接
#  - 只放学术相关的动态（论文、获奖、学术会议、项目等）；聚餐、节日等团队活动请放到 life.yaml（团队生活）
#  - page 可选：站内页面，例如 publications 表示「科研成果」页面
#  - image 可选：缩略图；没有图片时显示 tag 文字（如期刊简称）
#  - 论文类条目根据近期发表的论文自动生成（日期为 OpenAlex 记录的发表日期），请继续补充获奖、学术会议等真实动态
