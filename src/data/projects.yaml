applications:
  - title: { zh: 机场全景增强监视系统, en: Airport panoramic enhanced surveillance system }
    icon: eye
    desc:
      zh: 国内首套机场场面全景增强监视系统，融合视频、雷达与 ADS-B 数据，实现低能见度条件下的场面全景监视与航班标牌叠加。已部署于成都双流、重庆江北、昆明长水、广州白云、桂林两江等多个机场，列入民航局机场新技术名录，获民航科学技术奖二等奖。
      en: China's first panoramic enhanced surveillance system for airport surfaces. It fuses video, radar and ADS-B data to give a panoramic view of the airfield with flight labels, even in low visibility. Deployed at airports including Chengdu Shuangliu, Chongqing Jiangbei, Kunming Changshui, Guangzhou Baiyun and Guilin Liangjiang, listed in the CAAC catalogue of new airport technologies, and awarded a Second Prize of the Civil Aviation Science and Technology Award.
  - title: { zh: 跑道异物检测, en: Runway foreign object debris detection }
    icon: scan
    desc:
      zh: 依托国家自然科学基金民航联合基金重点项目开展跑道异物监测的基础理论与关键技术研究，相关技术已应用于北京大兴、成都天府、兰州中川等机场。
      en: Building on an NSFC–CAAC Joint Fund key project on the theory and key technologies of runway foreign object debris monitoring; the technology is in use at Beijing Daxing, Chengdu Tianfu and Lanzhou Zhongchuan airports.
  - title: { zh: 国产化机载娱乐系统, en: Domestic in-flight entertainment system }
    icon: layers
    desc:
      zh: 参与国产民机航电系统及设备国产化配套研制，相关机载娱乐系统已应用于 C919 大型客机，推动客舱核心系统和信息系统国产化。
      en: Contributed to the localization of avionics systems and equipment for domestic civil aircraft; the resulting in-flight entertainment system is used on the C919 airliner, helping localize core cabin and information systems.
  - title: { zh: 工业视觉检测算法, en: Industrial visual inspection algorithms }
    icon: code
    desc:
      zh: 面向半导体、汽车等制造场景研发高精度缺陷检测与质量控制算法，已在相关制造企业落地应用，显著提升检测效率和产品质量。
      en: High-precision defect detection and quality control algorithms for semiconductor, automotive and other manufacturing, deployed in production and markedly improving inspection efficiency and product quality.

