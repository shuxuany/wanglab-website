# ==============================================================
#  论文成果（网页会自动按年份倒序排列）
#  数据来源：OpenAlex 学术数据库（2026-10 检索），已人工剔除重名误归属与重复的预印本条目。
#  可能有遗漏（如中文期刊、最新录用论文），请补充或修改。
#
#  - authors：作者列表；通讯作者在名字后加 *，共同第一作者加 #
#             与 members.yaml 中英文名或 aliases 一致的作者会自动加粗
#  - short：期刊/会议简称，显示为醒目标签
#  - direction：对应 research.yaml 中的 id（brain / event / restore / perception / agents / multimodal），
#               留空表示不归入任何方向（仍会显示在论文页）
#  - featured: true 的论文显示在首页「代表性成果」（建议每个方向 1 篇）
#  - badge：可选标签，如 封面文章 / Oral / Best Paper
#  - figure：论文核心结构图，放在 public/images/papers/ 下，显示在首页轮播图中；figure_caption 为图注
#  - slide：是否出现在首页轮播图中（不填时与 featured 相同）
#  - doi / pdf / code：都可以留空；填了 pdf 时，首页轮播的「阅读论文」按钮会直接打开 PDF
#    注意：pdf 只能填可以合法公开的版本（arXiv、开放获取、作者录用稿），
#    Elsevier / IEEE 等出版社的正式版 PDF 不允许放在公开网站上
# ==============================================================

