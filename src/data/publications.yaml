# ==============================================================
#  论文成果（网页会自动按年份倒序排列）
#  数据来源：OpenAlex 学术数据库（2026-10 检索），已人工剔除重名误归属与重复的预印本条目。
#  可能有遗漏（如中文期刊、最新录用论文），请补充或修改。
#
#  - authors：作者列表；通讯作者在名字后加 *，共同第一作者加 #
#             与 members.yaml 中英文名或 aliases 一致的作者会自动加粗
#  - short：期刊/会议简称，显示为醒目标签
#  - category：论文所属的大类，填 categories.yaml 中的 id（按论文实际内容划分，不套用课题组的六个研究方向），
#              用于论文页的分类筛选
#  - topic：论文的具体研究主题（zh / en），显示为论文条目上的分类标签，圆点颜色取所属大类的颜色
#  - direction：可选，填 research.yaml 中的 id（rl / inspection / software / medical / restore / embodied），
#               只用于「研究方向」页各方向下的「相关论文」列表，只填确实属于该方向的论文
#  - featured：代表作标记
#  - slide: true：出现在首页轮播（导师介绍之后），按 impact 从高到低排列；summary 为轮播中显示的一句话简介（zh / en）
#             轮播只选课题组主导的论文（见下面的 lab_lead）
#  - impact：期刊影响因子（JCR 2025，2026 年 6 月发布；数值来自 BioxBio 汇总，正式数值以 Clarivate JCR 为准）
#            论文页最前面的「高影响因子论文」自动从课题组主导的论文中取 impact 最高的 5 篇（同分时较新的在前）；
#            每年 JCR 更新后改这里的数字即可
#  - lab_lead：是否为课题组主导的论文，一般不用填，按作者自动判断：课题组同学（members.yaml 中的在读成员和毕业校友）
#              是第一或第二作者且王老师在作者中，或王老师是第一作者；个别需要例外处理的论文填 lab_lead: true / false
#  - badge：可选标签，如 封面文章 / Oral / Best Paper
#  - figure：论文核心结构图，显示在首页轮播左侧；原图放在 assets/originals/images/papers/，运行 npm run watermark
#            生成 public/images/papers/ 下带水印的图片；figure_caption 为图注
#  - doi / pdf / code：都可以留空
#    注意：pdf 只能填可以合法公开的版本（arXiv、开放获取、作者录用稿），
#    Elsevier / IEEE 等出版社的正式版 PDF 不允许放在公开网站上
# ==============================================================

