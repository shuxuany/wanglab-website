tagline:
  zh: 让机器看得清、看得懂，并在真实世界中行动
  en: Machines that see clearly, understand deeply and act in the real world

# 首页第二屏的介绍（滚动时逐字点亮）
intro:
  zh: 视觉计算与智能决策实验室（VCID Lab）是王正宁教授领导的人工智能研究团队，围绕强化学习、工业视觉检测、工业 AI 软件、医学影像处理、图像增强与恢复和具身智能六个方向开展研究。从产线上的缺陷检测到医院里的脑影像，从暗光图像到会自主决策的智能体，我们既做前沿算法，也推动算法在真实场景中落地。
  en: The Visual Computing and Intelligent Decision Lab (VCID Lab) is an AI research group led by Prof. Zhengning Wang, working on six directions — reinforcement learning, industrial visual inspection, industrial AI software, medical image processing, image enhancement and restoration, and embodied intelligence. From defect detection on production lines to brain scans in hospitals, from low-light images to agents that make their own decisions, we develop frontier algorithms and bring them into real-world use.

