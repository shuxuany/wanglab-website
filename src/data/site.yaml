tagline:
  zh: 让机器看懂世界，用智能理解大脑
  en: Teaching machines to see — and using AI to understand the brain

# 首页第二屏的介绍（滚动时逐字点亮）
intro:
  zh: 我们是电子科技大学信息与通信工程学院王正宁教授领导的研究团队，从事多媒体通信、图像处理、计算机视觉与人工智能研究。从事件相机到三维点云，从低照度图像到人脑影像，我们让算法在真实世界中看得清、看得懂，并持续学习与进化。
  en: We are the research group led by Prof. Zhengning Wang at the School of Information and Communication Engineering, UESTC, working on multimedia communication, image processing, computer vision and artificial intelligence. From event cameras to 3D point clouds, from low-light images to human brain scans, we build algorithms that see clearly, understand deeply, and keep learning in the real world.

